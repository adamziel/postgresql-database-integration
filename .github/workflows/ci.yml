name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - trunk

jobs:
  test:
    name: PostgreSQL tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wordpress_test
          POSTGRES_USER: wordpress
          POSTGRES_PASSWORD: wordpress
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files
        run: composer run lint

      - name: Run PostgreSQL PHPUnit suite
        run: composer run test-postgresql
        env:
          PGSQL_TEST_DSN: pgsql:host=127.0.0.1;port=5432;dbname=wordpress_test
          PGSQL_TEST_USER: wordpress
          PGSQL_TEST_PASSWORD: wordpress

      - name: Run PostgreSQL smoke test
        run: composer run test-smoke
        env:
          PGSQL_TEST_DSN: pgsql:host=127.0.0.1;port=5432;dbname=wordpress_test
          PGSQL_TEST_USER: wordpress
          PGSQL_TEST_PASSWORD: wordpress

  duckdb:
    name: DuckDB tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, mbstring
          ini-values: ffi.enable=true
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install DuckDB PHP client
        timeout-minutes: 8
        run: |
          composer config --no-plugins allow-plugins.satur.io/duckdb-auto true
          composer require --dev --no-plugins --no-interaction --with-all-dependencies satur.io/duckdb-auto
          composer dump-autoload
          ./vendor/bin/install-c-lib

      - name: Verify DuckDB runtime
        timeout-minutes: 2
        run: php -d ffi.enable=true -r "require 'vendor/autoload.php'; require 'wp-includes/database/load.php'; WP_DuckDB_Runtime::assert_available( true );"

      - name: Run DuckDB PHPUnit suite
        timeout-minutes: 10
        run: composer run test-duckdb
        env:
          WP_DUCKDB_TESTS: '1'
          WP_DUCKDB_AUTOLOAD: ${{ github.workspace }}/vendor/autoload.php
          DUCKDB_PHP_AUTOLOAD: ${{ github.workspace }}/vendor/autoload.php

      - name: Run DuckDB S3 PHPUnit smoke against MinIO
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/minio-bin" "$RUNNER_TEMP/minio-data"
          curl -fsSL https://dl.min.io/server/minio/release/linux-amd64/minio -o "$RUNNER_TEMP/minio-bin/minio"
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$RUNNER_TEMP/minio-bin/mc"
          chmod +x "$RUNNER_TEMP/minio-bin/minio" "$RUNNER_TEMP/minio-bin/mc"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          minio_pid=$!
          trap 'kill "$minio_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              tail -100 "$RUNNER_TEMP/minio.log"
              exit 1
            fi
            sleep 1
          done
          "$RUNNER_TEMP/minio-bin/mc" alias set local http://127.0.0.1:9000 minioadmin minioadmin
          "$RUNNER_TEMP/minio-bin/mc" mb -p local/duckdb-wordpress-phpunit
          vendor/bin/phpunit --configuration phpunit-duckdb.xml.dist --filter test_s3_compatible_parquet_backend_round_trips_wordpress_mutations
        env:
          WP_DUCKDB_TESTS: '1'
          WP_DUCKDB_AUTOLOAD: ${{ github.workspace }}/vendor/autoload.php
          DUCKDB_PHP_AUTOLOAD: ${{ github.workspace }}/vendor/autoload.php
          WP_DUCKDB_S3_TESTS: '1'
          WP_DUCKDB_S3_EXTERNAL_STORAGE_DIR: s3://duckdb-wordpress-phpunit/wordpress/
          WP_DUCKDB_S3_SETUP_SQL_JSON: '["INSTALL httpfs","LOAD httpfs","CREATE OR REPLACE SECRET wp_s3_phpunit (TYPE s3, PROVIDER config, KEY_ID ''minioadmin'', SECRET ''minioadmin'', REGION ''us-east-1'', ENDPOINT ''127.0.0.1:9000'', URL_STYLE ''path'', USE_SSL false, SCOPE ''s3://duckdb-wordpress-phpunit/wordpress/'')"]'

  duckdb-parity:
    name: DuckDB parity tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, mbstring, pdo_sqlite
          ini-values: ffi.enable=true
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install DuckDB PHP client
        timeout-minutes: 8
        run: |
          composer config --no-plugins allow-plugins.satur.io/duckdb-auto true
          composer require --dev --no-plugins --no-interaction --with-all-dependencies satur.io/duckdb-auto
          composer dump-autoload
          ./vendor/bin/install-c-lib

      - name: Run DuckDB parity PHPUnit suite
        timeout-minutes: 25
        run: composer run test-duckdb-parity
        env:
          WP_DUCKDB_TESTS: '1'
          WP_DUCKDB_AUTOLOAD: ${{ github.workspace }}/vendor/autoload.php
          DUCKDB_PHP_AUTOLOAD: ${{ github.workspace }}/vendor/autoload.php

  package:
    name: Plugin package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build plugin zip
        run: ./bin/build-plugin-zip.sh

      - name: Verify plugin zip
        run: unzip -t build/wordpress-databases-support.zip

  wordpress-core:
    name: WordPress core PHPUnit
    runs-on: ubuntu-latest

    env:
      WORDPRESS_REF: '6.7.2'
      WP_CORE_TEST_DB_NAME: wordpress_develop_tests
      WP_CORE_TEST_DB_USER: wordpress
      WP_CORE_TEST_DB_PASSWORD: wordpress
      WP_CORE_TEST_DB_HOST: 127.0.0.1:5432

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wordpress_develop_tests
          POSTGRES_USER: wordpress
          POSTGRES_PASSWORD: wordpress
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: wordpress-databases-support

      - name: Check out WordPress core
        uses: actions/checkout@v4
        with:
          repository: WordPress/wordpress-develop
          ref: ${{ env.WORDPRESS_REF }}
          path: wordpress

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mysqli, gd, zip, mbstring
          coverage: none

      - name: Install WordPress Composer dependencies
        working-directory: wordpress
        run: composer update -W --no-interaction --no-progress --prefer-dist

      - name: Prepare WordPress core PostgreSQL test harness
        run: ./wordpress-databases-support/bin/prepare-wordpress-core-tests.sh wordpress wordpress-databases-support

      - name: Run WordPress core PHPUnit suite
        working-directory: wordpress
        run: ./vendor/bin/phpunit --configuration phpunit.xml.dist --colors=never

  wordpress-core-duckdb-db:
    name: WordPress core DuckDB DB tests
    runs-on: ubuntu-latest

    env:
      WORDPRESS_REF: '6.7.2'
      WP_CORE_TEST_DB_NAME: wordpress_develop_tests
      WP_CORE_TEST_DB_USER: wordpress
      WP_CORE_TEST_DB_PASSWORD: wordpress
      WP_CORE_TEST_DB_HOST: localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: wordpress-databases-support

      - name: Check out WordPress core
        uses: actions/checkout@v4
        with:
          repository: WordPress/wordpress-develop
          ref: ${{ env.WORDPRESS_REF }}
          path: wordpress

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, mysqli, gd, zip, mbstring
          ini-values: ffi.enable=true
          coverage: none

      - name: Install WordPress Composer dependencies
        working-directory: wordpress
        run: composer update -W --no-interaction --no-progress --prefer-dist

      - name: Prepare WordPress core DuckDB test harness
        run: ./wordpress-databases-support/bin/prepare-wordpress-core-duckdb-tests.sh wordpress wordpress-databases-support duckdb

      - name: Run WordPress core DB tests on DuckDB
        working-directory: wordpress
        run: php -d ffi.enable=true ./vendor/bin/phpunit --configuration phpunit.xml.dist --colors=never --filter '^Tests_DB'

  wordpress-core-duckdb-full:
    name: WordPress core DuckDB full PHPUnit
    runs-on: ubuntu-latest

    env:
      WORDPRESS_REF: '6.7.2'
      WP_CORE_TEST_DB_NAME: wordpress_develop_tests
      WP_CORE_TEST_DB_USER: wordpress
      WP_CORE_TEST_DB_PASSWORD: wordpress
      WP_CORE_TEST_DB_HOST: localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: wordpress-databases-support

      - name: Check out WordPress core
        uses: actions/checkout@v4
        with:
          repository: WordPress/wordpress-develop
          ref: ${{ env.WORDPRESS_REF }}
          path: wordpress

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, mysqli, gd, zip, mbstring
          ini-values: ffi.enable=true
          coverage: none

      - name: Install WordPress Composer dependencies
        working-directory: wordpress
        run: composer update -W --no-interaction --no-progress --prefer-dist

      - name: Prepare WordPress core DuckDB test harness
        run: ./wordpress-databases-support/bin/prepare-wordpress-core-duckdb-tests.sh wordpress wordpress-databases-support duckdb

      - name: Run full WordPress core PHPUnit suite on DuckDB
        timeout-minutes: 32
        working-directory: wordpress
        env:
          WP_DUCKDB_LOCK_TIMEOUT_SECONDS: '5'
        run: |
          set +e
          mkdir -p tests/phpunit/build/logs
          timeout --foreground --kill-after=30s 29m \
          php -d ffi.enable=true ./vendor/bin/phpunit \
            --configuration phpunit.xml.dist \
            --colors=never \
            --debug \
            --log-junit tests/phpunit/build/logs/junit.xml \
            2>&1 | tee duckdb-full-core.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload full DuckDB core PHPUnit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-core-duckdb-full-phpunit
          path: |
            wordpress/duckdb-full-core.log
            wordpress/tests/phpunit/build/logs/junit.xml
          if-no-files-found: ignore

  duckdb-wordpress-plugin-smoke:
    name: DuckDB WordPress plugin smoke (${{ matrix.backend }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: duckdb
            external_storage_dir: ''
            file_extension: ''
            read_sql: ''
            write_sql: ''
            setup_sql_json: ''
            atomic_flush: ''
          - backend: json
            external_storage_dir: ''
            file_extension: ''
            read_sql: ''
            write_sql: ''
            setup_sql_json: ''
            atomic_flush: ''
          - backend: csv
            external_storage_dir: ''
            file_extension: ''
            read_sql: ''
            write_sql: ''
            setup_sql_json: ''
            atomic_flush: ''
          - backend: parquet
            external_storage_dir: ''
            file_extension: ''
            read_sql: ''
            write_sql: ''
            setup_sql_json: ''
            atomic_flush: ''
          - backend: pipe_text
            external_storage_dir: ''
            file_extension: psv
            read_sql: 'SELECT * FROM read_csv_auto({path}, HEADER = true, DELIM = ''|'')'
            write_sql: 'COPY {table} TO {path} (HEADER, DELIMITER ''|'')'
            setup_sql_json: ''
            atomic_flush: ''
          - backend: sqlite_attach
            external_storage_dir: ''
            file_extension: ''
            read_sql: 'SELECT * FROM wp_store.{table}'
            write_sql: 'CREATE OR REPLACE TABLE wp_store.{table} AS SELECT * FROM {table}'
            setup_sql_json: '["INSTALL sqlite","LOAD sqlite","ATTACH ''{database_dir}/wordpress.sqlite'' AS wp_store (TYPE sqlite)"]'
            atomic_flush: '0'
          - backend: s3_parquet
            external_storage_dir: 's3://duckdb-wordpress-smoke/wordpress/'
            file_extension: parquet
            read_sql: 'SELECT * FROM read_parquet({path})'
            write_sql: 'COPY {table} TO {path} (FORMAT PARQUET, OVERWRITE_OR_IGNORE true)'
            setup_sql_json: '["INSTALL httpfs","LOAD httpfs","CREATE OR REPLACE SECRET wp_s3 (TYPE s3, PROVIDER config, KEY_ID ''minioadmin'', SECRET ''minioadmin'', REGION ''us-east-1'', ENDPOINT ''127.0.0.1:9000'', URL_STYLE ''path'', USE_SSL false, SCOPE ''s3://duckdb-wordpress-smoke/wordpress/'')"]'
            atomic_flush: '0'

    env:
      WORDPRESS_VERSION: '7.0'
      WOOCOMMERCE_VERSION: '10.9.1'
      QUERY_MONITOR_VERSION: '4.0.7'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, mysqli, gd, zip, mbstring
          ini-values: ffi.enable=true
          coverage: none

      - name: Run WordPress plugin smoke on DuckDB
        run: |
          set -euo pipefail
          if [ '${{ matrix.backend }}' = 's3_parquet' ]; then
            mkdir -p "$RUNNER_TEMP/minio-bin" "$RUNNER_TEMP/minio-data"
            curl -fsSL https://dl.min.io/server/minio/release/linux-amd64/minio -o "$RUNNER_TEMP/minio-bin/minio"
            curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$RUNNER_TEMP/minio-bin/mc"
            chmod +x "$RUNNER_TEMP/minio-bin/minio" "$RUNNER_TEMP/minio-bin/mc"
            MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
              "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
              > "$RUNNER_TEMP/minio.log" 2>&1 &
            minio_pid=$!
            trap 'kill "$minio_pid" >/dev/null 2>&1 || true' EXIT
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                tail -100 "$RUNNER_TEMP/minio.log"
                exit 1
              fi
              sleep 1
            done
            "$RUNNER_TEMP/minio-bin/mc" alias set local http://127.0.0.1:9000 minioadmin minioadmin
            "$RUNNER_TEMP/minio-bin/mc" mb -p local/duckdb-wordpress-smoke
          fi
          ./bin/duckdb-wordpress-plugin-smoke.sh ${{ matrix.backend }}
        env:
          WP_DUCKDB_EXTERNAL_STORAGE_DIR: ${{ matrix.external_storage_dir }}
          WP_DUCKDB_BACKEND_FILE_EXTENSION: ${{ matrix.file_extension }}
          WP_DUCKDB_BACKEND_READ_SQL: ${{ matrix.read_sql }}
          WP_DUCKDB_BACKEND_WRITE_SQL: ${{ matrix.write_sql }}
          WP_DUCKDB_BACKEND_SETUP_SQL_JSON: ${{ matrix.setup_sql_json }}
          WP_DUCKDB_BACKEND_ATOMIC_FLUSH: ${{ matrix.atomic_flush }}
