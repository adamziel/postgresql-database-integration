name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - trunk

jobs:
  test:
    name: PostgreSQL tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wordpress_test
          POSTGRES_USER: wordpress
          POSTGRES_PASSWORD: wordpress
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files
        run: composer run lint

      - name: Run PostgreSQL PHPUnit suite
        run: composer run test-postgresql
        env:
          PGSQL_TEST_DSN: pgsql:host=127.0.0.1;port=5432;dbname=wordpress_test
          PGSQL_TEST_USER: wordpress
          PGSQL_TEST_PASSWORD: wordpress

      - name: Run PostgreSQL smoke test
        run: composer run test-smoke
        env:
          PGSQL_TEST_DSN: pgsql:host=127.0.0.1;port=5432;dbname=wordpress_test
          PGSQL_TEST_USER: wordpress
          PGSQL_TEST_PASSWORD: wordpress
